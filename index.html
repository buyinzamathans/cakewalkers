<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cake Walkers | Kampala</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            
            <!-- Brand Icon (Crossed Whisk and Rolling Pin) -->
            <div class="brand-icon">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Rolling Pin -->
                    <path d="M25 75 L75 25" stroke="#e5b95c" stroke-width="4" stroke-linecap="round"/>
                    <path d="M30 70 L70 30" stroke="#e5b95c" stroke-width="8" stroke-linecap="round"/>
                    <!-- Whisk -->
                    <path d="M25 25 L50 50" stroke="#e5b95c" stroke-width="4" stroke-linecap="round"/>
                    <ellipse cx="65" cy="65" rx="15" ry="8" transform="rotate(-45 65 65)" stroke="#e5b95c" stroke-width="2"/>
                    <ellipse cx="65" cy="65" rx="15" ry="4" transform="rotate(-45 65 65)" stroke="#e5b95c" stroke-width="2"/>
                    <path d="M50 50 L75 75" stroke="#e5b95c" stroke-width="4" stroke-linecap="round"/>
                </svg>
            </div>

            <p class="location-tag">KAMPALA &middot; UGANDA</p>
            
            <h1 class="main-title">
                Cakes made for<br>
                <span class="highlight">unforgettable</span><br>
                occasions
            </h1>
            
            <div class="description-wrapper">
                <p class="hero-description">
                    Bespoke wedding, birthday and celebration cakes, baked to order and finished by hand.<br>
                    Love at first bite.
                </p>
            </div>
            
            <!-- WhatsApp Button -->
            <a href="https://wa.me/256777690441" class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
                ORDER ON WHATSAPP
            </a>
            
            <a href="#gallery" class="view-collection">VIEW THE COLLECTION</a>
        </div>
    </section>

</body>
</html>
